<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 730" font-family="Arial, Helvetica, sans-serif" font-size="14">
<title>How staging works</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
</defs>
<rect width="1300" height="730" fill="#ffffff"/>
<!-- server -->
<rect x="500" y="30" width="780" height="600" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="520" y="58" font-size="16" font-weight="bold" fill="#0f172a">Staging server (one DigitalOcean droplet, Ubuntu 24.04)</text>
<!-- networks -->
<rect x="625" y="85" width="375" height="255" rx="12" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-dasharray="6 4"/>
<text x="637" y="330" font-size="12" fill="#1d4ed8">app network (no way out to the internet)</text>
<rect x="825" y="85" width="370" height="130" rx="12" fill="#fde68a" fill-opacity="0.45" stroke="#b45309" stroke-dasharray="6 4"/>
<text x="1010" y="104" font-size="12" fill="#92400e">data network (no way out)</text>
<!-- containers -->
<rect x="640" y="115" width="140" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="710" y="140" text-anchor="middle" font-weight="bold">caddy</text>
<text x="710" y="158" text-anchor="middle" font-size="12">front door, HTTPS</text>
<text x="710" y="187" text-anchor="middle" font-size="11" fill="#475569">also on edge (internet)</text>
<rect x="840" y="115" width="140" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="910" y="145" text-anchor="middle" font-weight="bold">core-api</text>
<text x="910" y="165" text-anchor="middle" font-size="12">our application</text>
<rect x="1040" y="115" width="140" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="1110" y="145" text-anchor="middle" font-weight="bold">postgres</text>
<text x="1110" y="165" text-anchor="middle" font-size="12">the database</text>
<rect x="840" y="260" width="140" height="62" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="910" y="287" text-anchor="middle" font-weight="bold">mailpit</text>
<text x="910" y="305" text-anchor="middle" font-size="12">catches all emails</text>
<path d="M780,157 H840" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<path d="M980,157 H1040" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,200 V291 H840" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="748" y="260" font-size="11" fill="#475569">mail page</text>
<!-- gates -->
<rect x="510" y="115" width="105" height="85" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="562" y="140" text-anchor="middle" font-size="12" font-weight="bold">Firewall (ufw)</text>
<text x="562" y="158" text-anchor="middle" font-size="12">allows</text>
<text x="562" y="175" text-anchor="middle" font-size="12">tailscale0</text>
<path d="M615,157 H640" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>
<rect x="510" y="440" width="105" height="85" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="562" y="465" text-anchor="middle" font-size="12" font-weight="bold">Firewall (ufw)</text>
<text x="562" y="483" text-anchor="middle" font-size="12">allows SSH</text>
<text x="562" y="500" text-anchor="middle" font-size="12">port 22 only</text>
<!-- deploy chain -->
<rect x="640" y="440" width="200" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="740" y="465" text-anchor="middle" font-weight="bold" font-size="13">staging-deploy.sh</text>
<text x="740" y="484" text-anchor="middle" font-size="12">the only thing the</text>
<text x="740" y="500" text-anchor="middle" font-size="12">deploy key may run</text>
<rect x="880" y="440" width="190" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="975" y="465" text-anchor="middle" font-weight="bold" font-size="13">migrate, then start</text>
<text x="975" y="484" text-anchor="middle" font-size="12">backup, migrations, start,</text>
<text x="975" y="500" text-anchor="middle" font-size="12">version check or rollback</text>
<path d="M615,482 H640" stroke="#a16207" stroke-width="2" marker-end="url(#a)"/>
<path d="M840,482 H880" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<path d="M975,440 V342" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="985" y="400" font-size="11" fill="#475569">starts / replaces</text>
<rect x="1100" y="440" width="165" height="85" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="1182" y="465" text-anchor="middle" font-weight="bold" font-size="13">nightly backup</text>
<text x="1182" y="484" text-anchor="middle" font-size="12">02:15 dump</text>
<text x="1182" y="500" text-anchor="middle" font-size="12">02:45 restore test</text>
<path d="M1182,440 V202" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1174" y="330" text-anchor="end" font-size="11" fill="#475569">reads the database</text>
<text x="520" y="575" font-size="12" fill="#334155">Also on the server: fail2ban (blocks repeated failed logins), automatic security updates,</text>
<text x="520" y="594" font-size="12" fill="#334155">and the database password, which exists only as a file here (made by init-staging.sh).</text>
<!-- left side -->
<rect x="30" y="115" width="250" height="85" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="155" y="142" text-anchor="middle" font-weight="bold">Your laptop</text>
<text x="155" y="162" text-anchor="middle" font-size="12">Tailscale installed and signed in</text>
<text x="155" y="180" text-anchor="middle" font-size="12">browser opens the .ts.net name</text>
<path d="M280,157 H510" stroke="#15803d" stroke-width="3" marker-end="url(#g)"/>
<text x="395" y="140" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">Tailscale private network</text>
<text x="395" y="176" text-anchor="middle" font-size="12" fill="#15803d">encrypted, approved devices only</text>
<rect x="30" y="250" width="250" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="155" y="280" text-anchor="middle" font-weight="bold">Anyone else on the internet</text>
<text x="155" y="300" text-anchor="middle" font-size="12">not on your Tailscale network</text>
<path d="M280,285 H470" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M470,272 L492,298 M492,272 L470,298" stroke="#b91c1c" stroke-width="3"/>
<text x="375" y="275" text-anchor="middle" font-size="12" fill="#b91c1c">no route to the application</text>
<rect x="30" y="425" width="250" height="115" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="155" y="452" text-anchor="middle" font-weight="bold">GitHub Actions</text>
<text x="155" y="474" text-anchor="middle" font-size="12">1. runs checks and tests</text>
<text x="155" y="492" text-anchor="middle" font-size="12">2. builds the image of core-api</text>
<text x="155" y="510" text-anchor="middle" font-size="12">3. sends it over SSH</text>
<path d="M280,482 H510" stroke="#a16207" stroke-width="3" marker-end="url(#a)"/>
<text x="395" y="462" text-anchor="middle" font-size="12" fill="#a16207" font-weight="bold">SSH, public internet</text>
<text x="395" y="504" text-anchor="middle" font-size="12" fill="#a16207">key only, deploy key restricted</text>
<!-- legend -->
<text x="30" y="665" font-size="13" font-weight="bold" fill="#0f172a">How to read it</text>
<text x="30" y="688" font-size="13" fill="#334155">Green: the private path you use to look at staging. Yellow: the one public door (SSH), used by GitHub to deploy.</text>
<text x="30" y="708" font-size="13" fill="#334155">Blue and amber bands: Docker networks. Caddy cannot reach the database, and the database cannot reach the internet.</text>
</svg>
