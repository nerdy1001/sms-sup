version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A release younger than this is not proposed, which gives the community time to find a
    # compromised or broken version before it reaches this repository.
    cooldown:
      default-days: 5
    ignore:
      # The checks in tools/ use the TypeScript compiler API. A new major version is upgraded by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      development-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci(deps)"
  # Base images of the containers: the Dockerfile and the staging and local compose files.
  - package-ecosystem: docker
    directory: /apps/core-api
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker-compose
    directories:
      - /infra/staging
      - /infra/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
