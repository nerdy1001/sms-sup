# The staging environment of the core zone. Synthetic data only (task FN-08 provides it).
# It runs on one virtual server that is reachable only through the private Tailscale network.
# The deploy script sets APP_VERSION and TAILSCALE_IP; STAGING_HOSTNAME comes from /opt/staging/.env.
name: staging

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      # Bound to the Tailscale address on purpose. Docker publishes ports around the firewall,
      # so a port without an address would be open to the whole internet.
      - "${TAILSCALE_IP}:443:443"
      - "${TAILSCALE_IP}:8025:8025"
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # Lets Caddy ask the local Tailscale for the HTTPS certificate of this machine.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks: [edge, app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  core-api:
    image: minesup/core-api:${APP_VERSION}
    restart: unless-stopped
    environment:
      PORT: "3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [app, data]

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_DB: sms
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [data]

  # Catches every email the application sends, so that nothing reaches a real mailbox.
  mailpit:
    image: axllent/mailpit:v1.27.7
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks: [app]

networks:
  # The only network with a way out. Only the reverse proxy is on it.
  edge: {}
  # No route to the internet: a service on this network can talk to its neighbours only.
  app:
    internal: true
  data:
    internal: true

volumes:
  caddy-data: {}
  postgres-data: {}

secrets:
  postgres_password:
    file: ${STAGING_SECRETS_DIR:-/opt/staging/secrets}/postgres_password
